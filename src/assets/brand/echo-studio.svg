<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Echo Studio</title>
  <defs>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="core" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <radialGradient id="vg" cx="50%" cy="48%" r="60%">
      <stop offset="0" stop-color="#9A15EE" stop-opacity=".16"/>
      <stop offset="1" stop-color="#9A15EE" stop-opacity="0"/>
    </radialGradient>
    <mask id="mt" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <polygon points="508.8,420 515.2,420 569.6,500 454.4,500" fill="#000"/>
    </mask>
    <mask id="mb" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect y="508" width="1024" height="516" fill="#fff"/>
    </mask>
    <g id="mark" fill="none" stroke-linejoin="round" stroke-linecap="butt">
      <polyline mask="url(#mt)" points="500,460 376.2,460 512,260.3 647.8,460 524,460"/>
      <g mask="url(#mb)">
        <polyline points="429.3,495 323.3,655 492,655"/>
        <polyline points="594.7,495 700.7,655 532,655"/>
      </g>
    </g>
  </defs>
  
  <g stroke="#7810BA" stroke-width="48" opacity=".55" filter="url(#halo)"><use href="#mark"/></g>
  <g stroke="#9A15EE" stroke-width="50" opacity=".5" filter="url(#soft)"><use href="#mark"/></g>
  <g stroke="#9A15EE" stroke-width="44"><use href="#mark"/></g>
  <g stroke="#E9CCFB" stroke-width="16" opacity=".3" filter="url(#core)"><use href="#mark"/></g>
</svg>
