<!doctype html>
<html lang="tr" data-family="studio" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./src/assets/brand/partitura-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partitura</title>
    <!-- critical first paint: the Echo Studio dark ground before the stylesheet arrives -->
    <style>html,body{margin:0;background:#0b090f;color:#eef2f3}.d-brand img{width:28px;height:28px}</style>
  </head>
  <body class="d-app dark-theme">
    <!-- shared icon set: 24 grid, 1.6 line, round caps, no fill (Diapason rule) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-score" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></symbol>
      <symbol id="i-strip" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 10v4M10 10v4M14 10v4M18 10v4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-render" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></symbol>
      <symbol id="i-new" viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M12 11v6M9 14h6"/></symbol>
    </svg>

    <div class="app-shell">

      <!-- ===== sidebar: app, the four steps, appearance ===== -->
      <aside class="side">
        <div class="d-brand">
          <img src="./src/assets/brand/partitura.svg" width="28" height="28" alt="" id="app-brand-icon" />
          <span><span id="txt-app-title">Partitura</span><br /><small class="family"><img src="./src/assets/brand/echo-studio.svg" width="12" height="12" alt="" />Echo Studio</small></span>
          <span id="app-version" class="app-version"></span>
        </div>

        <ol class="d-list steps" aria-label="Adımlar">
          <li class="step-indicator active" id="step-ind-1" data-step="1" tabindex="0">
            <svg class="d-ico"><use href="#i-score" /></svg>
            <span class="step-text"><b data-i18n="step1Title"></b><small data-i18n="step1Sub"></small></span>
          </li>
          <li class="step-indicator" id="step-ind-2" data-step="2" tabindex="0">
            <svg class="d-ico"><use href="#i-image" /></svg>
            <span class="step-text"><b data-i18n="step2Title"></b><small data-i18n="step2Sub"></small></span>
          </li>
          <li class="step-indicator" id="step-ind-3" data-step="3" tabindex="0">
            <svg class="d-ico"><use href="#i-eye" /></svg>
            <span class="step-text"><b data-i18n="step3Title"></b><small data-i18n="step3Sub"></small></span>
          </li>
          <li class="step-indicator" id="step-ind-4" data-step="4" tabindex="0">
            <svg class="d-ico"><use href="#i-film" /></svg>
            <span class="step-text"><b data-i18n="step4Title"></b><small data-i18n="step4Sub"></small></span>
          </li>
        </ol>

        <div class="side-foot">
          <span class="d-label" data-i18n="appearance"></span>
          <div id="theme-switch" class="seg theme-switch" role="radiogroup" data-i18n-title="themeToggle">
            <button type="button" role="radio" data-apptheme="dark" data-i18n-title="themeDark"><svg class="d-ico"><use href="#i-moon" /></svg></button>
            <button type="button" role="radio" data-apptheme="light" data-i18n-title="themeLight"><svg class="d-ico"><use href="#i-sun" /></svg></button>
          </div>
          <select id="language-select" class="lang-select" aria-label="Language">
            <option value="tr" selected>Türkçe</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="ru">Русский</option>
            <option value="ja">日本語</option>
            <option value="zh">中文</option>
          </select>
          <label class="row"><span data-i18n="uiSounds"></span><input type="checkbox" class="d-toggle" id="ui-sound-toggle" checked /></label>
          <div class="maker">
            <img src="./src/assets/brand/echo-masterworks-seal.svg" width="22" height="22" alt="" />
            <span>Echo Masterworks</span>
          </div>
        </div>
      </aside>

      <main class="main">

        <!-- ===== Page 1: score, projects, video format, glow colour ===== -->
        <section id="page-1" class="page active">
          <header class="d-bar d-glass page-bar">
            <div class="bar-title"><span class="d-label" data-i18n="step1Sub"></span><h1 class="d-title" data-i18n="step1Title"></h1></div>
            <div class="bar-actions">
              <button id="next-to-page2" class="d-btn is-primary" disabled><span data-i18n="proceed"></span><svg class="d-ico"><use href="#i-next" /></svg></button>
            </div>
          </header>

          <div class="page-body setup-grid">
            <div class="col">
              <article class="d-card d-rise" style="--i:1">
                <span class="d-label" data-i18n="musicFile"></span>
                <div class="drop-zone-wrapper music-drop" id="music-drop-zone-wrap">
                  <!-- CRITICAL: transparent native input covering the whole box (keep this design) -->
                  <input type="file" id="file-input" accept=".musicxml,.xml,.mxl,text/xml,application/xml" />
                  <div class="drop-zone" id="music-drop-trigger">
                    <svg class="d-ico big"><use href="#i-score" /></svg>
                    <span id="file-name-label" data-i18n-html="selectMusic"></span>
                    <span class="d-chip is-accent browse-btn" data-i18n="browse"></span>
                  </div>
                  <div id="music-loaded-state" class="file-loaded-state" style="display: none;">
                    <span class="d-chip is-accent"><span class="dot"></span><span id="music-loaded-text" class="loaded-status-text"></span></span>
                    <span class="d-chip browse-btn" id="lbl-change-file-text" data-i18n="changeClick"></span>
                  </div>
                </div>
              </article>

              <article class="d-card d-rise grow" style="--i:2">
                <span class="d-label" data-i18n="savedProjects"></span>
                <div id="projects-list-container" class="projects-list"></div>
              </article>
            </div>

            <div class="col">
              <article class="d-card d-rise" style="--i:3">
                <span class="d-label" data-i18n="secVideoFormat"></span>
                <div class="opt-rows">
                  <div class="opt-row">
                    <span data-i18n="fps"></span>
                    <div class="seg" id="fps-group">
                      <button class="pill" data-fps="24">24</button>
                      <button class="pill" data-fps="25">25</button>
                      <button class="pill" data-fps="30">30</button>
                      <button class="pill active" data-fps="60">60</button>
                      <button class="pill" data-fps="120">120</button>
                    </div>
                  </div>
                  <div class="opt-row">
                    <span data-i18n="aspect"></span>
                    <div class="seg" id="aspect-group">
                      <button class="pill active" data-aspect="16-9">16:9</button>
                      <button class="pill" data-aspect="9-16">9:16</button>
                      <button class="pill" data-aspect="1-1">1:1</button>
                      <button class="pill" data-aspect="4-3">4:3</button>
                      <button class="pill" data-aspect="4-5">4:5</button>
                    </div>
                  </div>
                  <div class="opt-row">
                    <span data-i18n="resolution"></span>
                    <div class="seg" id="res-group">
                      <button class="pill" data-res="720p">720p</button>
                      <button class="pill active" data-res="1080p">1080p</button>
                      <button class="pill" data-res="2k">2K</button>
                      <button class="pill" data-res="4k">4K</button>
                    </div>
                  </div>
                </div>
              </article>

              <article class="d-card d-rise" style="--i:4">
                <span class="d-label" data-i18n="colorPalette"></span>
                <div class="palette-layout">
                  <div class="palette-swatches">
                    <!-- which staff's colour is being edited (two-staff scores) -->
                    <div class="color-targets">
                      <button type="button" class="color-target d-bracket active" data-target="a" id="color-target-a">
                        <span class="target-swatch" id="target-swatch-a"></span><span data-i18n="colorStaff1"></span>
                      </button>
                      <button type="button" class="color-target d-bracket" data-target="b" id="color-target-b">
                        <span class="target-swatch" id="target-swatch-b"></span><span data-i18n="colorStaff2"></span>
                      </button>
                    </div>
                    <label class="row"><span data-i18n="dualColor"></span><input type="checkbox" class="d-toggle" id="dual-color-toggle" /></label>
                    <span class="sub-label" data-i18n="presetColors"></span>
                    <div class="color-picker-group" id="preset-colors">
                      <button class="color-btn active" data-color="#FF0000" style="background:#FF0000;" title="#FF0000"></button>
                      <button class="color-btn" data-color="#0055FF" style="background:#0055FF;" title="#0055FF"></button>
                      <button class="color-btn" data-color="#FFD500" style="background:#FFD500;" title="#FFD500"></button>
                      <button class="color-btn" data-color="#00C853" style="background:#00C853;" title="#00C853"></button>
                      <button class="color-btn" data-color="#FF6D00" style="background:#FF6D00;" title="#FF6D00"></button>
                      <button class="color-btn" data-color="#AA00FF" style="background:#AA00FF;" title="#AA00FF"></button>
                    </div>
                    <span class="sub-label" data-i18n="savedColors"></span>
                    <div class="color-picker-group saved-colors" id="saved-colors"></div>
                  </div>

                  <!-- always-open colour picker -->
                  <div class="inline-picker">
                    <div class="sv-box" id="sv-box"><div class="sv-cursor" id="sv-cursor"></div></div>
                    <div class="hue-bar" id="hue-bar"><div class="hue-cursor" id="hue-cursor"></div></div>
                    <div class="picker-side">
                      <span class="sub-label" data-i18n="freeColor"></span>
                      <div class="color-preview" id="color-preview"></div>
                      <input type="text" id="color-hex-input" class="d-input hex-input" value="#FF0000" maxlength="7" spellcheck="false" />
                      <button id="save-color-btn" class="d-btn is-sm" data-i18n="saveColor"></button>
                    </div>
                  </div>
                </div>
              </article>
            </div>
          </div>
        </section>

        <!-- ===== Page 2: background, music, intro / outro screens ===== -->
        <section id="page-2" class="page">
          <header class="d-bar d-glass page-bar">
            <div class="bar-title"><span class="d-label" data-i18n="step2Sub"></span><h1 class="d-title" data-i18n="bgStudioTitle"></h1></div>
            <div class="bar-actions">
              <button id="back-to-page1" class="d-btn is-ghost"><svg class="d-ico"><use href="#i-back" /></svg><span data-i18n="backToSettings"></span></button>
              <button id="next-to-page3" class="d-btn is-primary"><span data-i18n="nextToPreview"></span><svg class="d-ico"><use href="#i-next" /></svg></button>
            </div>
          </header>

          <div class="page-body studio-grid">
            <article class="d-card stage-card d-rise" style="--i:1">
              <div class="viewport-wrapper" id="bg-stage-wrapper">
                <div id="bg-stage-viewport" class="viewport dark-anim-theme">
                  <div id="bg-stage-media-wrap" class="bg-media-container">
                    <img id="bg-stage-img" style="display:none;" alt="" />
                    <video id="bg-stage-video" style="display:none;" muted autoplay playsinline></video>
                    <canvas id="fx-canvas-stage" class="fx-canvas"></canvas>
                  </div>
                  <canvas id="card-preview-canvas" class="card-preview-canvas"></canvas>
                  <div class="stage-guide-overlay"><span data-i18n="stageGuide"></span></div>
                </div>
              </div>
            </article>

            <article class="d-card side-card d-rise" style="--i:2">
              <div class="seg tabs" role="tablist">
                <button type="button" class="pill side-tab active" data-tab="bg" data-i18n="tabBackground"></button>
                <button type="button" class="pill side-tab" data-tab="music" data-i18n="tabMusic"></button>
                <button type="button" class="pill side-tab" data-tab="screens" data-i18n="tabScreens"></button>
              </div>

              <!-- background -->
              <div class="tab-pane active" data-pane="bg">
                <span class="d-label" data-i18n="bgMediaTitle"></span>
                <div class="drop-zone-wrapper" id="bg-drop-zone-wrap">
                  <input type="file" id="bg-media-input" accept="image/*,video/mp4,video/webm,video/quicktime" hidden />
                  <label class="drop-zone small" for="bg-media-input" id="bg-drop-label">
                    <span id="bg-name-label" data-i18n="bgSelectLabel"></span>
                    <span class="d-chip is-accent browse-btn" data-i18n="selectFile"></span>
                  </label>
                  <div id="bg-loaded-state" class="file-loaded-state" style="display: none;">
                    <span id="bg-loaded-text" class="loaded-status-text"></span>
                    <div class="btn-pair">
                      <label for="bg-media-input" class="d-btn is-sm" data-i18n="change"></label>
                      <button id="bg-clear-btn" class="d-btn is-sm is-danger" data-i18n="clear"></button>
                    </div>
                  </div>
                </div>
                <button id="bg-loop-btn" type="button" class="toggle-row"><span data-i18n="tgLoop"></span><i class="switch"></i></button>
                <button id="bg-grayscale-btn" type="button" class="toggle-row"><span data-i18n="tgGrayscale"></span><i class="switch"></i></button>

                <span class="d-label" data-i18n="secLayout"></span>
                <label class="slider-row"><span><span data-i18n="scale"></span><b class="d-mono d-accent"><span id="bg-scale-val">100</span>%</b></span>
                  <input type="range" class="d-range" id="bg-scale-range" min="20" max="250" value="100" /></label>
                <label class="slider-row"><span><span data-i18n="opacity"></span><b class="d-mono d-accent"><span id="bg-opacity-val">50</span>%</b></span>
                  <input type="range" class="d-range" id="bg-opacity-range" min="0" max="100" value="50" /></label>
                <label class="slider-row"><span><span data-i18n="posX"></span><b class="d-mono d-accent"><span id="bg-pos-x-val">0</span>%</b></span>
                  <input type="range" class="d-range" id="bg-pos-x-range" min="-100" max="100" value="0" /></label>
                <label class="slider-row"><span><span data-i18n="posY"></span><b class="d-mono d-accent"><span id="bg-pos-y-val">0</span>%</b></span>
                  <input type="range" class="d-range" id="bg-pos-y-range" min="-100" max="100" value="0" /></label>

                <!-- atmosphere: haze and embers, each with its own switch and intensity -->
                <span class="d-label" data-i18n="secAtmosphere"></span>
                <button id="fog-toggle-btn" type="button" class="toggle-row"><span data-i18n="tgFog"></span><i class="switch"></i></button>
                <label class="slider-row fx-row" id="fog-row"><span><span data-i18n="fogIntensity"></span><b class="d-mono d-accent"><span id="fog-val">35</span>%</b></span>
                  <input type="range" class="d-range" id="fog-range" min="5" max="100" value="35" /></label>
                <button id="embers-toggle-btn" type="button" class="toggle-row"><span data-i18n="tgEmbers"></span><i class="switch"></i></button>
                <label class="slider-row fx-row" id="embers-row"><span><span data-i18n="embersIntensity"></span><b class="d-mono d-accent"><span id="embers-val">35</span>%</b></span>
                  <input type="range" class="d-range" id="embers-range" min="5" max="100" value="35" /></label>
              </div>

              <!-- music track (optional) -->
              <div class="tab-pane" data-pane="music">
                <span class="d-label" data-i18n="audioTitle"></span>
                <div class="drop-zone-wrapper" id="audio-drop-zone-wrap">
                  <input type="file" id="audio-input" accept="audio/*,.mp3,.wav,.ogg,.oga,.m4a,.aac,.flac,.opus" hidden />
                  <label class="drop-zone small" for="audio-input" id="audio-drop-label">
                    <span class="drop-zone-label" data-i18n="audioSelectLabel"></span>
                    <span class="d-chip is-accent browse-btn" data-i18n="selectFile"></span>
                  </label>
                  <div id="audio-loaded-state" class="file-loaded-state" style="display: none;">
                    <span id="audio-loaded-text" class="loaded-status-text"></span>
                    <div class="btn-pair">
                      <label for="audio-input" class="d-btn is-sm" data-i18n="change"></label>
                      <button id="audio-clear-btn" class="d-btn is-sm is-danger" data-i18n="clear"></button>
                    </div>
                  </div>
                </div>

                <div id="audio-controls" class="audio-controls disabled">
                  <label class="slider-row"><span><span data-i18n="audioVolume"></span><b class="d-mono d-accent"><span id="audio-volume-val">100</span>%</b></span>
                    <input type="range" class="d-range" id="audio-volume-range" min="0" max="150" value="100" /></label>
                  <div class="slider-row">
                    <span><span data-i18n="audioOffset"></span><input type="number" id="audio-offset-input" class="d-input num-input" value="0" step="0.05" min="-600" max="600" /></span>
                    <input type="range" class="d-range" id="audio-offset-range" min="-30" max="30" step="0.05" value="0" />
                    <small class="hint-text" data-i18n="audioOffsetHint"></small>
                  </div>
                  <button id="audio-preview-btn" class="d-btn wide"></button>
                </div>
              </div>

              <!-- intro / outro: ordered lists of screens (video and/or text template), played before / after the score -->
              <div class="tab-pane" data-pane="screens">
                <div class="seg" id="card-tabs">
                  <button class="pill-mini active" data-card="intro" data-i18n="cardIntro"></button>
                  <button class="pill-mini" data-card="outro" data-i18n="cardOutro"></button>
                </div>
                <small class="hint-text" id="card-list-hint"></small>
                <ol id="card-list" class="card-list"></ol>
                <div class="card-add-row">
                  <input type="file" id="card-add-video-input" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov,.m4v" hidden />
                  <label for="card-add-video-input" id="card-add-video-btn" class="d-btn is-sm" data-i18n="cardAddVideo"></label>
                  <button id="card-add-text-btn" class="d-btn is-sm" data-i18n="cardAddText"></button>
                </div>

                <div id="card-editor" class="card-editor" style="display: none;">
                  <div class="drop-zone-wrapper" id="card-video-wrap">
                    <input type="file" id="card-video-input" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov,.m4v" hidden />
                    <label class="drop-zone small" for="card-video-input" id="card-video-label">
                      <span class="drop-zone-label" data-i18n="cardVideoLabel"></span>
                      <span class="d-chip is-accent browse-btn" data-i18n="selectFile"></span>
                    </label>
                    <div id="card-video-loaded" class="file-loaded-state" style="display: none;">
                      <span id="card-video-text" class="loaded-status-text"></span>
                      <button id="card-video-clear" class="d-btn is-sm is-danger" data-i18n="clear"></button>
                    </div>
                  </div>
                  <button id="card-text-btn" class="d-btn is-sm wide"></button>
                  <div id="card-order-row" class="card-order-row" style="display: none;">
                    <span class="sub-label" data-i18n="cardOrder"></span>
                    <div class="seg" id="card-order-group">
                      <button class="pill-mini" data-order="textFirst" data-i18n="cardOrderTextFirst"></button>
                      <button class="pill-mini" data-order="videoFirst" data-i18n="cardOrderVideoFirst"></button>
                      <button class="pill-mini" data-order="together" data-i18n="cardOrderTogether"></button>
                    </div>
                  </div>
                  <div id="card-text-editor" class="card-text-editor" style="display: none;">
                    <div class="seg" id="card-template-group">
                      <button class="pill-mini" data-template="classic" data-i18n="tplClassic"></button>
                      <button class="pill-mini" data-template="modern" data-i18n="tplModern"></button>
                      <button class="pill-mini" data-template="cinematic" data-i18n="tplCinematic"></button>
                    </div>
                    <label class="field-row"><span data-i18n="fieldTitle"></span><input type="text" class="d-input" id="card-f-title" maxlength="120" /></label>
                    <label class="field-row"><span data-i18n="fieldComposer"></span><input type="text" class="d-input" id="card-f-composer" maxlength="120" /></label>
                    <label class="field-row"><span data-i18n="fieldSubtitle"></span><input type="text" class="d-input" id="card-f-subtitle" maxlength="120" /></label>
                    <label class="field-row"><span data-i18n="fieldExtra"></span><input type="text" class="d-input" id="card-f-extra" maxlength="120" /></label>
                  </div>
                  <label class="slider-row"><span><span data-i18n="cardDuration"></span><b class="d-mono d-accent"><span id="card-duration-val">5</span> s</b></span>
                    <input type="range" class="d-range" id="card-duration-range" min="2" max="20" step="0.5" value="5" />
                    <small class="hint-text" id="card-duration-hint"></small></label>
                  <button id="card-preview-btn" class="d-btn is-sm wide" data-i18n="cardPreview"></button>
                </div>
              </div>
            </article>
          </div>
        </section>

        <!-- ===== Page 3: score preview, tempo and view settings, player bar ===== -->
        <section id="page-3" class="page">
          <header class="d-bar d-glass page-bar">
            <div class="bar-title"><span class="d-label" id="config-summary-text">60 FPS • 1080p • 16:9</span><h1 class="d-title" data-i18n="step3Title"></h1></div>
            <div class="bar-actions">
              <button id="back-to-page2" class="d-btn is-ghost"><svg class="d-ico"><use href="#i-back" /></svg><span data-i18n="backToBg"></span></button>
              <button id="export-strip-btn" class="d-btn"><svg class="d-ico"><use href="#i-strip" /></svg><span data-i18n="exportStrip"></span></button>
              <button id="save-project-btn-2" class="d-btn"><svg class="d-ico"><use href="#i-save" /></svg><span data-i18n="saveProj"></span></button>
              <button id="to-page4" class="d-btn is-primary"><span data-i18n="finalize"></span><svg class="d-ico"><use href="#i-next" /></svg></button>
            </div>
          </header>

          <div class="page-body preview-body">
            <article class="d-card stage-card d-rise" style="--i:1">
              <div class="viewport-wrapper" id="viewport-wrapper">
                <div id="viewport" class="viewport light-anim-theme">
                  <div id="custom-bg-layer" class="bg-media-container">
                    <img id="preview-bg-img" style="display:none;" alt="" />
                    <video id="preview-bg-video" style="display:none;" muted autoplay playsinline></video>
                    <canvas id="fx-canvas-preview" class="fx-canvas"></canvas>
                  </div>
                  <div class="playhead"></div>
                  <div id="score-track" class="score-track">
                    <div id="osmd-container"></div>
                    <div id="score-diamonds-layer"></div>
                  </div>
                  <div id="score-loading" class="score-loading hidden" data-i18n="preparingScore"></div>
                </div>
              </div>
            </article>

            <div class="settings-strip">
              <article class="d-card d-rise" style="--i:2">
                <div class="row"><span class="d-label" data-i18n="diamondTitle"></span><span id="lbl-diamond-count" class="d-chip"></span></div>
                <div class="diamond-row">
                  <button id="add-diamond-btn" class="d-btn is-sm" data-i18n="diamond"></button>
                  <div id="diamond-track" class="diamond-track"></div>
                </div>
                <div class="inline-fields">
                  <label class="num-field"><span data-i18n="baseBpm"></span><input type="number" id="bpm-input" class="d-input num-input" value="120" min="20" max="400" step="any" /></label>
                  <label class="num-field" id="audio-offset-mini" style="display: none;"><span data-i18n="audioOffsetShort"></span><input type="number" id="audio-offset-input-3" class="d-input num-input" value="0" step="0.05" min="-600" max="600" /></label>
                </div>
              </article>

              <article class="d-card d-rise" style="--i:3">
                <span class="d-label" data-i18n="secTempo"></span>
                <label class="slider-row"><span><span data-i18n="fermataStretch"></span><b class="d-mono d-accent">×<span id="fermata-val">2.00</span></b></span>
                  <input type="range" class="d-range" id="fermata-range" min="1" max="6" step="0.05" value="2" />
                  <small class="hint-text" data-i18n="fermataHint"></small></label>
              </article>

              <article class="d-card d-rise" style="--i:4">
                <span class="d-label" data-i18n="secView"></span>
                <div class="row">
                  <span data-i18n="animTheme"></span>
                  <div class="seg" id="anim-theme-group">
                    <button class="pill-mini" data-animtheme="dark" data-i18n="themeDark"></button>
                    <button class="pill-mini active" data-animtheme="light" data-i18n="themeLight"></button>
                  </div>
                </div>
                <label class="slider-row"><span><span data-i18n="noteSize"></span><b class="d-mono d-accent"><span id="zoom-val">70</span>%</b></span>
                  <input type="range" class="d-range" id="zoom-range" min="30" max="150" value="70" /></label>
                <label class="row"><span data-i18n="playhead"></span><input type="checkbox" class="d-toggle" id="playhead-toggle" checked /></label>
              </article>
            </div>
          </div>

          <!-- glass player bar -->
          <footer class="player d-glass">
            <button id="play-btn" class="d-btn is-primary play-btn"></button>
            <button id="reset-btn" class="d-btn is-ghost" data-i18n="reset"></button>
            <span id="time-current" class="d-mono time-label">0:00.0</span>
            <input type="range" class="d-range" id="seek-range" min="0" max="1000" step="1" value="0" />
            <span id="time-total" class="d-mono time-label">0:00.0</span>
            <span class="shortcuts-hint" data-i18n="shortcutsHint"></span>
          </footer>
        </section>

        <!-- ===== Page 4: final video preview, summary, output, render ===== -->
        <section id="page-4" class="page">
          <header class="d-bar d-glass page-bar">
            <div class="bar-title"><span class="d-label" data-i18n="step4Sub"></span><h1 class="d-title" data-i18n="step4Title"></h1></div>
            <div class="bar-actions">
              <button id="back-to-page3" class="d-btn is-ghost"><svg class="d-ico"><use href="#i-back" /></svg><span data-i18n="backToPreview"></span></button>
              <button id="restart-btn" class="d-btn is-ghost"><svg class="d-ico"><use href="#i-new" /></svg><span data-i18n="newProj"></span></button>
              <button id="save-project-btn-3" class="d-btn"><svg class="d-ico"><use href="#i-save" /></svg><span data-i18n="saveProj"></span></button>
              <button id="render-btn" class="d-btn is-primary render-start-btn"><svg class="d-ico"><use href="#i-render" /></svg><span data-i18n="startRender"></span></button>
            </div>
          </header>

          <div class="page-body final-grid">
            <!-- the finished video, drawn by the render's own code (reduced size, real time, with sound) -->
            <article class="d-card final-preview-card d-rise" style="--i:1">
              <span class="d-label" data-i18n="finalPreviewTitle"></span>
              <div class="final-preview-stage" id="final-preview-stage">
                <canvas id="final-preview-canvas"></canvas>
                <div class="final-preview-overlay" id="final-preview-overlay">
                  <button id="final-preview-start" class="d-btn is-primary" data-i18n="finalPreviewStart"></button>
                  <small class="hint-text" data-i18n="finalPreviewHint"></small>
                </div>
              </div>
              <div class="final-preview-controls">
                <button id="final-preview-play" class="d-btn is-sm" disabled></button>
                <span id="final-preview-time" class="d-mono time-label">0:00 / 0:00</span>
                <input type="range" class="d-range" id="final-preview-seek" min="0" max="1000" value="0" disabled />
              </div>
              <div id="final-preview-sections" class="final-preview-sections"></div>
            </article>

            <div class="col">
              <article class="d-card d-rise" style="--i:2">
                <span class="d-label" data-i18n="secSummary"></span>
                <dl class="summary-list">
                  <dt data-i18n="confMusic"></dt>
                  <dd id="summary-file-name"></dd>
                  <dt data-i18n="confBg"></dt>
                  <dd id="summary-bg-name"></dd>
                </dl>
              </article>

              <article class="d-card d-rise" style="--i:3">
                <span class="d-label" data-i18n="outputSettings"></span>
                <div class="seg format-options">
                  <label class="format-pill active"><input type="radio" name="format" value="mp4" checked> MP4 · H.264</label>
                  <label class="format-pill"><input type="radio" name="format" value="webm"> WebM · VP9</label>
                </div>
                <label class="row"><span data-i18n="leadInToggle"></span><input type="checkbox" class="d-toggle" id="lead-in-toggle" checked /></label>
              </article>

              <article class="d-card d-bracket render-card d-rise grow" style="--i:4" id="render-action-area">
                <span class="d-label" data-i18n="secRender"></span>
                <div class="render-visual">
                  <img id="render-loader" class="render-loader" src="./src/assets/brand/echo-masterworks-seal.svg" alt="" draggable="false" />
                  <div class="render-readout">
                    <div id="render-pct" class="render-pct">0%</div>
                    <div id="render-eta" class="render-eta"></div>
                  </div>
                </div>
                <div id="success-desc" class="render-status-text"></div>
                <div class="d-progress"><i id="render-progress-bar" style="width: 0%;"></i></div>
                <div class="export-buttons-flex">
                  <button id="render-pause-btn" class="d-btn is-sm" style="display:none;"></button>
                  <button id="render-cancel-btn" class="d-btn is-sm is-danger" style="display:none;" data-i18n="cancelRender"></button>
                  <button id="render-open-btn" class="d-btn is-sm" style="display:none;" data-i18n="showInFolder"></button>
                </div>
              </article>
            </div>
          </div>
        </section>

      </main>
    </div>

    <!-- tempo diamond dialog -->
    <div id="diamond-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card d-glass">
        <div class="modal-header"><span data-i18n="dmTitle"></span></div>
        <div class="modal-body">
          <p data-i18n="dmPrompt"></p>
          <input type="number" id="modal-bpm-input" class="d-input" value="140" min="20" max="400" step="any" />
        </div>
        <div class="modal-footer">
          <button id="modal-delete-btn" class="d-btn is-danger" style="display: none;" data-i18n="dmDelete"></button>
          <button id="modal-cancel-btn" class="d-btn is-ghost" data-i18n="cancel"></button>
          <button id="modal-save-btn" class="d-btn is-primary" data-i18n="apply"></button>
        </div>
      </div>
    </div>

    <!-- strip image export dialog -->
    <div id="strip-export-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card d-glass wide">
        <div class="modal-header"><span data-i18n="stripTitle"></span></div>
        <div class="modal-body">
          <p data-i18n="stripPrompt"></p>
          <div class="strip-fmt-grid">
            <button class="d-btn strip-fmt-btn" data-fmt="png" data-i18n="fmtPng"></button>
            <button class="d-btn strip-fmt-btn" data-fmt="jpeg" data-i18n="fmtJpeg"></button>
            <button class="d-btn strip-fmt-btn" data-fmt="webp" data-i18n="fmtWebp"></button>
            <button class="d-btn strip-fmt-btn" data-fmt="svg" data-i18n="fmtSvg"></button>
          </div>
          <label class="row" id="strip-bg-row">
            <span data-i18n="stripBgBlur"></span>
            <input type="checkbox" class="d-toggle" id="strip-bg-blur" />
          </label>
          <small class="hint-text" id="strip-bg-hint"></small>
        </div>
        <div class="modal-footer">
          <button id="strip-modal-cancel" class="d-btn is-ghost" data-i18n="close"></button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
