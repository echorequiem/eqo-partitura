name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Syntax check (main process)
        run: |
          node --check electron/main.js
          node --check electron/ipc-common.js
          node --check electron/ipc-files.js
          node --check electron/ipc-projects.js
          node --check electron/preload.cjs

      - name: Build renderer
        run: npm run build
